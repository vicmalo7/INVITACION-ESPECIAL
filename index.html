<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Ti ❤️</title>

<style>
    body {
        margin: 0;
        font-family: 'Georgia', serif;
        background: linear-gradient(135deg, #2b0f1c, #1a1a1a);
        color: #f5e6e8;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        text-align: center;
    }

    .card {
        background: rgba(255, 255, 255, 0.08);
        padding: 50px;
        border-radius: 20px;
        backdrop-filter: blur(12px);
        box-shadow: 0 0 50px rgba(255, 105, 135, 0.3);
        max-width: 500px;
        animation: fadeIn 2s ease;
    }

    h1 {
        font-size: 26px;
        margin-bottom: 25px;
        font-weight: normal;
    }

    p {
        font-size: 18px;
        line-height: 1.6;
        margin-bottom: 35px;
    }

    button {
        background: transparent;
        border: 1px solid #ff8fa3;
        padding: 12px 30px;
        color: #ffb3c1;
        font-size: 16px;
        border-radius: 30px;
        cursor: pointer;
        transition: 0.4s ease;
    }

    button:hover {
        background: #ff8fa3;
        color: #1a1a1a;
        transform: scale(1.05);
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .heart {
        position: absolute;
        font-size: 20px;
        animation: float 6s infinite ease-in;
        opacity: 0.4;
    }

    @keyframes float {
        0% { transform: translateY(100vh); opacity: 0; }
        50% { opacity: 0.6; }
        100% { transform: translateY(-10vh); opacity: 0; }
    }
</style>
</head>

<body>

<div class="card">
    <h1>Hay algo que quiero preguntarte…</h1>
    <p>
        No necesito una fecha especial ni una excusa perfecta.  
        Me basta con saber que cuando estoy contigo todo se siente en su lugar.  

        Quiero invitarte a salir…  
        a compartir un momento nuestro,  
        de esos que no se publican,  
        pero se recuerdan siempre.
    </p>
    <button onclick="aceptar()">Sí, quiero ❤️</button>
</div>

<script>
function aceptar() {
    document.querySelector('.card').innerHTML = `
        <h1>Entonces hagámoslo simple…</h1>
        <p>
            Tú y yo.  
            Sin distracciones.  
            Como cuando todo empezó  
            y lo único importante era estar juntos.
        </p>
    `;
}

// corazones flotando
for (let i = 0; i < 15; i++) {
    let heart = document.createElement("div");
    heart.innerHTML = "❤";
    heart.className = "heart";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (4 + Math.random() * 3) + "s";
    heart.style.fontSize = (15 + Math.random() * 15) + "px";
    document.body.appendChild(heart);
}
</script>

</body>
</html>
